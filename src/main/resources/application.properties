# ---------- Banco MySQL ----------
spring.datasource.url=jdbc:mysql://localhost:3306/igreja_db?useSSL=false&serverTimezone=America/Sao_Paulo&createDatabaseIfNotExist=true
spring.datasource.driverClassName=com.mysql.cj.jdbc.Driver
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:SUA_SENHA_LOCAL_AQUI}

# ---------- JPA / Hibernate ----------
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ---------- JWT ----------
jwt.secret=${JWT_SECRET:troque-essa-chave-por-uma-bem-longa-e-aleatoria-depois-em-producao-1234567890}
jwt.expiration=86400000